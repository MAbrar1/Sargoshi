[workspace]
resolver = "3"
# server/crates/* is added to this list by P03, which creates that directory.
members = ["core/crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"

# Exact pins (Prompt B hard rule 7). Versions were verified against crates.io on
# 25 Nov 2026 and are at least 14 days old; see docs/ledger/DEPENDENCIES.md.
[workspace.dependencies]
prost = { version = "=0.14.5", default-features = false, features = ["derive", "std"] }
thiserror = "=2.0.21"
proptest = "=1.12.0"
x25519-dalek = "=3.0.0"
ed25519-dalek = "=3.0.0"
curve25519-dalek = "=5.0.0"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
hkdf = "=0.13.0"
sha2 = "=0.11.1"
zeroize = "=1.9.1"
subtle = "=2.6.1"
getrandom = "=0.4.3"
ml-kem = { version = "=0.3.4", features = ["zeroize"] }
sg-common = { path = "core/crates/sg-common" }
sg-crypto = { path = "core/crates/sg-crypto" }
sg-handshake = { path = "core/crates/sg-handshake" }

[workspace.lints.rust]
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Cryptographic dependencies are compiled with optimisation even in debug builds so that the
# property and known-answer tests run in seconds instead of minutes.
[profile.dev.package."*"]
opt-level = 2
