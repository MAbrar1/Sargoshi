include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated by flutter gen-l10n; uses deprecated delegates internally.
    - lib/l10n/app_localizations*.dart
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    avoid_print: error
    prefer_const_constructors: warning

linter:
  rules:
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - always_declare_return_types
    - unawaited_futures
    - use_super_parameters
    - directives_ordering
# Left/right layout ban and hardcoded-string ban are enforced by
# tool/ci/check_directional.py and tool/ci/check_hardcoded_strings.py.
