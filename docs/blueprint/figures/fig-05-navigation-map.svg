y2="482" stroke="#A7A9C7" stroke-width="1" opacity="0.6"/><line x1="742" y1="482" x2="756" y2="482" stroke="#A7A9C7" stroke-width="1" opacity="0.6"/><rect x="756" y="468" width="174" height="28" rx="9" fill="#20254A" /><text x="843.0" y="486.0" font-family="Inter Medium" font-size="11.5" fill="#EDEBFF" text-anchor="middle" >Focus profiles</text><line x1="742" y1="498" x2="742" y2="518" stroke="#A7A9C7" stroke-width="1" opacity="0.6"/><line x1="742" y1="518" x2="756" y2="518" stroke="#A7A9C7" stroke-width="1" opacity="0.6"/><rect x="756" y="504" width="174" height="28" rx="9" fill="#20254A" /><text x="843.0" y="522.0" font-family="Inter Medium" font-size="11.5" fill="#EDEBFF" text-anchor="middle" >Data usage</text><line x1="742" y1="534" x2="742" y2="554" stroke="#A7A9C7" stroke-width="1" opacity="0.6"/><line x1="742" y1="554" x2="756" y2="554" stroke="#A7A9C7" stroke-width="1" opacity="0.6"/><rect x="756" y="540" width="174" height="28" rx="9" fill="#20254A" /><text x="843.0" y="558.0" font-family="Inter Medium" font-size="11.5" fill="#EDEBFF" text-anchor="middle" >Alert history</text><rect x="40" y="640" width="590" height="230" rx="18" fill="#17135A" stroke="#4A3FD6" stroke-width="1.5" /><text x="58" y="664" font-family="Inter" font-size="11" fill="#FF8A4C" text-anchor="start" letter-spacing="1.6">VAULT SPACE (OWN LOCK, INDIGO)</text><rect x="58" y="678" width="130" height="34" rx="9" fill="#4A3FD6" /><text x="123.0" y="699.0" font-family="Inter SemiBold" font-size="11.5" fill="#fff" text-anchor="middle" >Vault lock</text><line x1="188" y1="695" x2="208" y2="695" stroke="#B9B1FF" stroke-width="1.5"/><rect x="208" y="678" width="130" height="34" rx="9" fill="#4A3FD6" /><text x="273.0" y="699.0" font-family="Inter SemiBold" font-size="11.5" fill="#fff" text-anchor="middle" >Vault home</text><rect x="58" y="730" width="104" height="30" rx="9" fill="#20254A" /><text x="110.0" y="749.0" font-family="Inter Medium" font-size="11.5" fill="#EDEBFF" text-anchor="middle" >Gallery</text><rect x="170" y="730" width="104" height="30" rx="9" fill="#20254A" /><text x="222.0" y="749.0" font-family="Inter Medium" font-size="11.5" fill="#EDEBFF" text-anchor="middle" >Files</text><rect x="282" y="730" width="104" height="30" rx="9" fill="#20254A" /><text x="334.0" y="749.0" font-family="Inter Medium" font-size="11.5" fill="#EDEBFF" text-anchor="middle" >Audio</text><rect x="394" y="730" width="104" height="30" rx="9" fill="#20254A" /><text x="446.0" y="749.0" font-family="Inter Medium" font-size="11.5" fill="#EDEBFF" text-anchor="middle" >Notes</text><rect x="506" y="730" width="104" height="30" rx="9" fill="#20254A" /><text x="558.0" y="749.0" font-family="Inter Medium" font-size="11.5" fill="#EDEBFF" text-anchor="middle" >Vault chats</text><rect x="58" y="770" width="104" height="30" rx="9" fill="#20254A" /><text x="110.0" y="789.0" font-family="Inter Medium" font-size="11.5" fill="#EDEBFF" text-anchor="middle" >ID wallet</text><rect x="170" y="770" width="104" height="30" rx="9" fill="#20254A" /><text x="222.0" y="789.0" font-family="Inter Medium" font-size="11.5" fill="#EDEBFF" text-anchor="middle" >Trash</text><rect x="282" y="770" width="104" height="30" rx="9" fill="#20254A" /><text x="334.0" y="789.0" font-family="Inter Medium" font-size="11.5" fill="#EDEBFF" text-anchor="middle" >Camera</text><rect x="394" y="770" width="104" height="30" rx="9" fill="#20254A" /><text x="446.0" y="789.0" font-family="Inter Medium" font-size="11.5" fill="#EDEBFF" text-anchor="middle" >Checkup</text><rect x="506" y="770" width="104" height="30" rx="9" fill="#20254A" /><text x="558.0" y="789.0" font-family="Inter Medium" font-size="11.5" fill="#EDEBFF" text-anchor="middle" >Footprint scan</text><text x="58" y="826" font-family="Inter" font-size="11.5" fill="#B9B1FF" text-anchor="start" >Entered from You, or by the logo gesture when the entry is hidden (VLT-17).</text><text x="58" y="846" font-family="Inter" font-size="11.5" fill="#B9B1FF" text-anchor="start" >Vault routes are never deep-linkable and never listed in shortcuts or share targets.</text><line x1="830" y1="560" x2="830" y2="640" stroke="#B9B1FF" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="830" y1="640" x2="630" y2="700" stroke="#B9B1FF" stroke-width="1.5" stroke-dasharray="4 4"/><text x="660" y="664" font-family="Inter" font-size="11" fill="#FF8A4C" text-anchor="start" letter-spacing="1.6">GLOBAL OVERLAYS</text><rect x="660" y="678" width="300" height="192" rx="18" fill="#12152B" stroke="#2E3463" stroke-width="1" /><rect x="672" y="692" width="136" height="34" rx="9" fill="#12372B" /><text x="740.0" y="713.0" font-family="Inter Medium" font-size="11.5" fill="#EDEBFF" text-anchor="middle" >Search (Ctrl K)</text><rect x="816" y="692" width="136" height="34" rx="9" fill="#12372B" /><text x="884.0" y="713.0" font-family="Inter Medium" font-size="11.5" fill="#EDEBFF" text-anchor="middle" >Alert sheet</text><rect x="672" y="736" width="136" height="34" rx="9" fill="#12372B" /><text x="740.0" y="757.0" font-family="Inter Medium" font-size="11.5" fill="#EDEBFF" text-anchor="middle" >Share target</text><rect x="816" y="736" width="136" height="34" rx="9" fill="#12372B" /><text x="884.0" y="757.0" font-family="Inter Medium" font-size="11.5" fill="#EDEBFF" text-anchor="middle" >Deep links</text><rect x="672" y="780" width="136" height="34" rx="9" fill="#12372B" /><text x="740.0" y="801.0" font-family="Inter Medium" font-size="11.5" fill="#EDEBFF" text-anchor="middle" >Quick lock gesture</text><rect x="816" y="780" width="136" height="34" rx="9" fill="#12372B" /><text x="884.0" y="801.0" font-family="Inter Medium" font-size="11.5" fill="#EDEBFF" text-anchor="middle" >Incoming call</text><text x="672" y="842" font-family="Inter" font-size="11.5" fill="#A7A9C7" text-anchor="start" >Overlays open above any tab and return to it.</text><text x="40" y="904" font-family="Inter" font-size="12" fill="#A7A9C7" text-anchor="start" >Rules: each tab keeps its own back stack and scroll position. Back never leaves the app from a nested screen.</text><text x="40" y="924" font-family="Inter" font-size="12" fill="#A7A9C7" text-anchor="start" >Tapping the active tab scrolls to top, then pops to the tab root. Predictive back previews every pop.</text><text x="40" y="944" font-family="Inter" font-size="12" fill="#A7A9C7" text-anchor="start" >On medium and expanded windows the list, chat and info panes replace pushes. The rail replaces the bottom bar.</text><text x="40" y="964" font-family="Inter" font-size="12" fill="#A7A9C7" text-anchor="start" >Routes and deep links are listed in Section 6.12.</text></svg>
