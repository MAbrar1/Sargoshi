name: sargoshi
description: Sargoshi, a private messenger. Say it softly.
publish_to: none
version: 0.1.0+1

environment:
  # TODO(verify): ADR-001 provisional pin, Flutter 3.47.1 / Dart 3.13.1.
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  # Flutter 3.47+ moved Material and Cupertino into separate packages.
  material_ui: any # TODO(verify) pin a version once resolved (commit pubspec.lock)
  cupertino_ui: any # TODO(verify) same
  flutter_riverpod: ^2.6.1 # TODO(verify) current major
  go_router: ^14.0.0 # TODO(verify) current major

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0 # TODO(verify) current major
  pigeon: any # typed platform channels; TODO(verify) pin via pubspec.lock

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/licenses/
  # Subsetted OFL fonts, built by tool/fonts/build_fonts.py. No runtime fetching.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
