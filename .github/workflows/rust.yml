name: rust
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.22.1
      - name: Dependency age (14 days) for every locked crate
        run: node tools/check-dep-age.mjs
      - name: Full gate (fmt, clippy -D warnings, tests, cargo deny)
        run: node tools/gate.mjs --full
