name: fmt
on:
  push:
    branches: [claude/vault-content]
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: "3.50.0"}
      - run: flutter pub get
      - run: dart format lib test
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet; then
            git config user.name "fmt-bot"
            git config user.email "fmt-bot@users.noreply.github.com"
            git commit -am "Format (temporary fmt workflow)"
            git push
          fi
