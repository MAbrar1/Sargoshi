name: scaffold
on: workflow_dispatch
jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: "3.50.0"}
      - run: flutter --version
      - run: flutter create --platforms=android --org app.sargoshi --project-name sargoshi /tmp/gen
      - uses: actions/upload-artifact@v4
        with: {name: android-template, path: /tmp/gen/android, include-hidden-files: true}
      - name: Dump template
        run: |
          cd /tmp/gen
          for f in $(find android -type f -not -name "*.png" -not -name "*.jar" -not -path "*/build/*" | sort); do
            echo "=====FILE $f"; cat "$f"; done
      - name: Dump wrapper jar
        run: |
          cd /tmp/gen/android/gradle/wrapper
          ls -la
          echo "=====JARB64"; base64 -w0 gradle-wrapper.jar; echo; echo "=====JAREND"
          sha256sum gradle-wrapper.jar
