name: fonts
on: workflow_dispatch
jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install fonttools
      - name: Fetch sources
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/google/fonts /tmp/gf
          cd /tmp/gf
          git sparse-checkout set ofl/inter ofl/instrumentserif ofl/jetbrainsmono
          echo "SOURCE_COMMIT $(git rev-parse HEAD)"
          ls -la ofl/inter ofl/instrumentserif ofl/jetbrainsmono
      - name: Build
        run: python3 tool/fonts/build_fonts.py /tmp/gf /tmp/fonts_out
      - name: Dump
        run: |
          cd /tmp/fonts_out
          for f in *.ttf; do echo "=====B64 $f"; base64 -w76 "$f"; echo "=====ENDB64"; sha256sum "$f"; done
          for f in licenses/*.txt; do echo "=====TXT $f"; cat "$f"; echo "=====ENDTXT"; done
          echo "=====ALLDONE"
