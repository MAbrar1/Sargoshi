name: ci
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install fonttools
      - name: Banned words
        run: python3 tool/ci/banned_words.py
      - name: Contrast
        run: python3 tool/ci/check_contrast.py
      - name: Directional layout
        run: python3 tool/ci/check_directional.py
      - name: ARB
        run: python3 tool/ci/check_arb.py
      - name: Hardcoded strings
        run: python3 tool/ci/check_hardcoded_strings.py
      - name: Icon font matches Dart constants
        run: python3 tool/ci/check_icons.py
      - name: Release gate (reports blockers, fails on misuse)
        run: python3 tool/ci/check_release_ready.py

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: "3.50.0"}
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter gen-l10n
      - run: flutter analyze
      - name: Build host native core for FFI tests
        run: cargo build --release --locked -p sargoshi_ffi --manifest-path rust/Cargo.toml
      - name: Flutter tests (including dart:ffi against the real library)
        run: flutter test
        env:
          SARGOSHI_FFI_LIB: ${{ github.workspace }}/rust/target/release/libsargoshi_ffi.so

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked --workspace -- -D warnings
      - run: cargo test --release --locked --workspace
  android:
    runs-on: ubuntu-latest
    needs: [flutter]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: "3.50.0"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - name: Rust Android targets and cargo-ndk
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked
      - name: Build native core for Android (16 KB page alignment)
        env:
          RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384
        working-directory: rust
        run: |
          echo "NDK: $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o ../android/app/src/main/jniLibs \
            build --release --locked -p sargoshi_ffi
          find ../android/app/src/main/jniLibs -name '*.so' -exec ls -l {} +
      - name: Build release APKs (per ABI)
        run: flutter build apk --release --split-per-abi
      - name: Sizes
        run: ls -l build/app/outputs/flutter-apk/*.apk
      - name: Merged manifest allow-list
        run: |
          M=$(find build/app/intermediates -path '*merged_manifest*' -name AndroidManifest.xml | grep -i release | head -1)
          echo "using $M"
          python3 tool/ci/check_manifest.py "$M"
      - name: Native core present per ABI and size budget
        run: python3 tool/ci/check_apk.py build/app/outputs/flutter-apk/*-release.apk
      - name: 16 KB ELF alignment
        run: python3 tool/ci/check_elf_alignment.py build/app/outputs/flutter-apk/*.apk
  android-keystore:
    runs-on: ubuntu-latest
    needs: [flutter]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: "3.50.0"}
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Keystore tests on an emulator (real AndroidKeyStore)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd android && ./gradlew connectedDebugAndroidTest --stacktrace
# Not yet implemented (later stages): detekt/ktlint, merged-manifest allow-list,
# ELF 16 KB alignment, FakeCryptoCore-in-release check, AI-module-no-network
# check, Gradle dependency verification, cargo-deny/audit, OSV, SBOM, goldens.
