name: ci
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Banned words
        run: python3 tool/ci/banned_words.py
      - name: Contrast
        run: python3 tool/ci/check_contrast.py
      - name: Directional layout
        run: python3 tool/ci/check_directional.py
      - name: ARB
        run: python3 tool/ci/check_arb.py

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: "3.50.0"}
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/sargoshi_core
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --release --locked
# Not yet implemented (later stages): detekt/ktlint, merged-manifest allow-list,
# ELF 16 KB alignment, FakeCryptoCore-in-release check, AI-module-no-network
# check, Gradle dependency verification, cargo-deny/audit, OSV, SBOM, goldens.
