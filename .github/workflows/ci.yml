name: ci
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install fonttools
      - name: Banned words
        run: python3 tool/ci/banned_words.py
      - name: Contrast
        run: python3 tool/ci/check_contrast.py
      - name: Directional layout
        run: python3 tool/ci/check_directional.py
      - name: ARB
        run: python3 tool/ci/check_arb.py
      - name: Hardcoded strings
        run: python3 tool/ci/check_hardcoded_strings.py
      - name: Icon font matches Dart constants
        run: python3 tool/ci/check_icons.py

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: "3.50.0"}
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/sargoshi_core
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --release --locked
  android:
    runs-on: ubuntu-latest
    needs: [flutter]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: "3.50.0"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - name: Build release APKs (per ABI)
        run: flutter build apk --release --split-per-abi
      - name: Sizes
        run: ls -l build/app/outputs/flutter-apk/*.apk
      - name: Merged manifest allow-list
        run: |
          M=$(find build/app/intermediates -path '*merged_manifest*' -name AndroidManifest.xml | grep -i release | head -1)
          echo "using $M"
          python3 tool/ci/check_manifest.py "$M"
      - name: 16 KB ELF alignment
        run: python3 tool/ci/check_elf_alignment.py build/app/outputs/flutter-apk/*.apk
# Not yet implemented (later stages): detekt/ktlint, merged-manifest allow-list,
# ELF 16 KB alignment, FakeCryptoCore-in-release check, AI-module-no-network
# check, Gradle dependency verification, cargo-deny/audit, OSV, SBOM, goldens.
