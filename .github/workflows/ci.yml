name: ci
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Banned words
        run: python3 tool/ci/banned_words.py
      - name: Contrast
        run: python3 tool/ci/check_contrast.py
      - name: Directional layout
        run: python3 tool/ci/check_directional.py
      - name: ARB
        run: python3 tool/ci/check_arb.py

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO(verify): pin the exact Flutter version from ADR-001.
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test
# Not yet implemented (later stages): detekt/ktlint, merged-manifest allow-list,
# ELF 16 KB alignment, FakeCryptoCore-in-release check, AI-module-no-network
# check, Gradle dependency verification, cargo-deny/audit, OSV, SBOM, goldens.
